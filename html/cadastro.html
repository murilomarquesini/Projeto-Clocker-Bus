<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clocker Bus - Cadastro</title>

    <link rel="icon" type="image/png" href="../imagens/favicon.png">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="../css/cssL.css">
</head>

<body>

<div class="background">

<div class="card">

<!-- LADO ESQUERDO -->
<div class="left">

<img src="../imagens/logo.png" 
alt="Clocker Bus" 
class="logo">

</div>

<!-- LADO DIREITO -->
<div class="right">

<div class="form-container">

<h2>Cadastro</h2>

<div class="form-box">

<!-- FORMULÁRIO -->
<form id="formCadastro" novalidate>

<label>Tipo de usuário</label>

<select id="tipoUsuario" required>
    <option value="estudante">Estudante</option>
    <option value="motorista">Motorista</option>
</select>

<input
id="nome"
type="text"
placeholder="Nome completo"
required
minlength="5"
pattern="^[A-Za-zÀ-ÿ\s']+$"
>

<input
id="email"
type="email"
placeholder="E-mail"
required
minlength="10"
>

<div class="senha-container">
<input
id="senha"
type="password"
placeholder="Crie sua senha"
required
pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$"
>

<i class="fa-solid fa-eye olho-senha"></i>
</div>

<button type="submit">
Cadastrar
</button>

</form>

</div>

<p class="register">
Já tem conta?
<a href="./login.html">Entrar</a>
</p>

</div>
</div>

</div>

<footer>
© 2026 Clocker Bus. Todos os direitos reservados.
</footer>

<footer>
Desenvolvido para disciplina de Interação Humano-Computador.
</footer>

</div>

<!-- IMPORTANTE -->
<script type="module" src="../js/cadastro.js"></script>

</body>
</html>
